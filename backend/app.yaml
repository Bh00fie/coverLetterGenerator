runtime: nodejs20

# Secrets live in env.yaml (git-ignored) so they are never committed. It should look like:
#   env_variables:
#     MONGODB_URI: "mongodb+srv://<user>:<password>@<cluster>/..."
#     JWT_SECRET: "<long random string>"
#     CORS_ORIGIN: "https://<your-netlify-site>.netlify.app"
includes:
  - env.yaml

handlers:
  - url: /.*
    script: auto
