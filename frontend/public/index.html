<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-61SLPG4VLD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-61SLPG4VLD');
    </script>

    <!-- Primary SEO -->
    <title>Free AI Cover Letter Generator – Tailored Cover Letters in Minutes</title>
    <meta
      name="description"
      content="Write a tailored cover letter in minutes with AI. Paste your CV and the job description, pick a language, and get a professional cover letter you can edit, copy or download. Free."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Abhinandan Thour" />
    <link rel="canonical" href="https://reactcoverlettergenerator.netlify.app/" />

    <!-- Open Graph / social sharing -->

    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
